name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    container: rust:1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install rustfmt and clippy
        run: rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -p webhook-reconcile --all-targets -- -D warnings
      - name: Test
        run: cargo test -p webhook-reconcile
  anchor:
    name: anchor
    runs-on: ubuntu-latest
    container: solanafoundation/anchor:v1.0.2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the event-lab stub
        run: export HOME=/root && anchor build --ignore-keys
      - name: LiteSVM hello test
        run: export HOME=/root && cd lab && npm ci --no-audit --no-fund && npm test

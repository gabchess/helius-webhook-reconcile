[package]
name = "webhook-reconcile"
version = "0.0.1"
edition = "2021"
description = "Find Helius webhook events that were never delivered"
license = "MIT"
default-run = "webhook-reconcile"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
bs58 = "0.5"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }

# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_instructions:
    - path: "crates/**"
      instructions: |
        Rust CLI code. Check error handling (no unwrap in non-test code), that tests run offline with no API key,
        and that no HELIUS_API_KEY or URL containing a key is logged, printed or stored in a fixture.
    - path: "programs/**"
      instructions: |
        Anchor program code. Check account validation, signer checks and event emission.
        programs/event-lab is a stub until chunk 2.
    - path: ".github/workflows/**"
      instructions: |
        Actions must be pinned to a commit SHA or an exact version. Job names rust and anchor are required
        status checks on main, so do not rename them.
